# Rebuilds the site once a day so edits to the "ESA Website Content" Google Sheet go live.
# It calls a Vercel Deploy Hook; Vercel then rebuilds the site, which fetches the sheet.
#
# Setup (once): Vercel → Project → Settings → Git → Deploy Hooks → create "daily",
# then GitHub → Settings → Secrets and variables → Actions → New secret
# named VERCEL_DEPLOY_HOOK with the hook URL.
#
# To update right away: GitHub → Actions → "Daily rebuild" → Run workflow.

name: Daily rebuild

on:
  schedule:
    # 16:00 UTC = 9 AM in Arizona (Arizona doesn't change clocks, so this stays 9 AM all year)
    - cron: "0 16 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::The VERCEL_DEPLOY_HOOK secret is not set. See the comments at the top of this file."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 -X POST "$VERCEL_DEPLOY_HOOK"
          echo "Rebuild requested. The site updates in a few minutes."
